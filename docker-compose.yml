services:
  postgres-user:
    image: postgres:16
    container_name: postgres-user
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
      - ./init-user.sql:/docker-entrypoint-initdb.d/init-user.sql
    networks:
      - taskflow-network

  postgres-task:
    image: postgres:16
    container_name: postgres-task
    environment:
      POSTGRES_DB: ${TASK_DB_NAME}
      POSTGRES_USER: ${TASK_DB_USER}
      POSTGRES_PASSWORD: ${TASK_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-task-data:/var/lib/postgresql/data
      - ./init-task.sql:/docker-entrypoint-initdb.d/init-task.sql
    networks:
      - taskflow-network

  mongodb:
    image: mongo:7.0
    container_name: mongo-notification
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - taskflow-network      
     
  redis:
    image: redis:7-alpine
    container_name: radis-cache
    ports:
      - "6379:6379"
    networks:
      - taskflow-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-message
    ports:
      - "9092:9092"    
    environment:  
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'  
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - taskflow-network

  user-service:
    image: ${DOCKERHUB_USERNAME}/taskflow-user-service:latest
    container_name: user-service
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/${USER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres-user
    networks:
      - taskflow-network

  task-service:
    image: ${DOCKERHUB_USERNAME}/taskflow-task-service:latest
    container_name: task-service
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-task:5432/${TASK_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${TASK_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${TASK_DB_PASSWORD}
    depends_on:
      - postgres-task
    networks:
      - taskflow-network

  api-gateway:
    image: ${DOCKERHUB_USERNAME}/taskflow-api-gateway:latest
    container_name: api-gateway
    ports:
      - "9090:9090"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - user-service
      - task-service
    networks:
      - taskflow-network
        
networks:
  taskflow-network:
    driver: bridge

volumes:
  postgres-user-data:
  postgres-task-data:  
  mongodb-data:  
  kafka_data:  




